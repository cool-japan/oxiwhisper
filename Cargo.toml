[package]
name = "oxiwhisper"
version = "0.2.0"
edition = "2024"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
description = "Pure Rust Whisper inference engine with minimal dependencies"
repository = "https://github.com/cool-japan/oxiwhisper"
homepage = "https://github.com/cool-japan/oxiwhisper"
keywords = ["whisper", "speech-recognition", "asr", "inference", "audio"]
categories = ["multimedia::audio", "science"]
documentation = "https://docs.rs/oxiwhisper"

[features]
timing = []
onnx = ["dep:oxionnx"]
serde = ["dep:serde", "dep:serde_json"]
test-utils = []
audio-flac = ["dep:symphonia", "symphonia/flac"]
audio-ogg  = ["dep:symphonia", "symphonia/ogg", "symphonia/vorbis"]
audio-mp3  = ["dep:symphonia", "symphonia/mp3"]
audio-aac  = ["dep:symphonia", "symphonia/aac", "symphonia/isomp4"]
audio-opus = ["dep:opus-decoder", "dep:ogg"]
audio-all  = ["audio-flac", "audio-ogg", "audio-mp3", "audio-aac", "audio-opus"]
parallel   = ["dep:rayon"]
# Speaker diarization pipeline. Clustering (AHC + spectral) and the symmetric
# eigensolver are implemented inline, so this pulls in no scirs2-cluster /
# scirs2-linalg dependency.
diarization = []

[dependencies]
half = "2.7"
matrixmultiply = "0.3"
memmap2 = "0.9"
oxifft = "0.4.2"
rayon = { version = "1.12", optional = true }
# NOTE: oxionnx 0.1.2 transitively pins oxifft ^0.2.0 via oxionnx-ops.
# This causes a duplicate oxifft entry in Cargo.lock when `onnx` feature
# is enabled. Track: https://github.com/cool-japan/oxionnx
oxionnx = { version = "0.1.7", optional = true }
rand = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
symphonia = { version = "0.6", default-features = false, optional = true }
opus-decoder = { version = "0.1", optional = true }
ogg = { version = "0.9", optional = true }

# Always compile with optimisations — inference is compute-heavy
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[[example]]
name = "transcribe"
path = "examples/transcribe.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "bench2"
path = "examples/bench2.rs"

[[example]]
name = "check_shapes"
path = "examples/check_shapes.rs"

[[example]]
name = "check_shapes2"
path = "examples/check_shapes2.rs"

[[example]]
name = "test_voice"
path = "examples/test_voice.rs"

[[example]]
name = "profile_attention"
path = "examples/profile_attention.rs"

[[example]]
name = "profile_threading"
path = "examples/profile_threading.rs"

[[example]]
name = "onnx_transcribe"
path = "examples/onnx_transcribe.rs"
required-features = ["onnx"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[example]]
name = "batch_transcribe"
path = "examples/batch_transcribe.rs"

[[example]]
name = "diarize"
path = "examples/diarize.rs"
required-features = ["diarization"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Single-crate project (no workspace) — a plain version dependency is correct here.
proptest = "1.11"

[[bench]]
name = "transcribe"
harness = false
